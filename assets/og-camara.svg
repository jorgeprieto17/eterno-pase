<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-camara-title">
  <title id="og-camara-title">Cámara Desechable en Vivo · Álbum Eterno — Eterno Pase</title>
  <defs>
    <radialGradient id="cam-bg-glow" cx="50%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#24211B"/>
      <stop offset="58%" stop-color="#171614"/>
      <stop offset="100%" stop-color="#121212"/>
    </radialGradient>
    <linearGradient id="cam-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D77B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A88422"/>
    </linearGradient>
    <linearGradient id="cam-polaroid-photo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#352B24"/>
      <stop offset="55%" stop-color="#6B4F3B"/>
      <stop offset="100%" stop-color="#C89B62"/>
    </linearGradient>
  </defs>

  <!-- Fondo editorial oscuro -->
  <rect width="1200" height="630" fill="url(#cam-bg-glow)"/>
  <circle cx="1060" cy="115" r="210" fill="#D4AF37" fill-opacity="0.06"/>
  <circle cx="135" cy="530" r="190" fill="#D4AF37" fill-opacity="0.05"/>

  <!-- Marco editorial exterior -->
  <rect x="44" y="44" width="1112" height="542" rx="28" fill="none" stroke="#D4AF37" stroke-opacity="0.34" stroke-width="2"/>
  <rect x="58" y="58" width="1084" height="514" rx="22" fill="none" stroke="#FAF8F4" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Esquinas de visor analógico -->
  <path d="M92 128 V92 H128" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <path d="M1072 92 H1108 V128" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <path d="M92 502 V538 H128" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <path d="M1072 538 H1108 V502" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>

  <!-- Insignia superior EN VIVO -->
  <rect x="462" y="96" width="276" height="38" rx="19" fill="#1A1917" stroke="#D4AF37" stroke-opacity="0.45" stroke-width="1.5"/>
  <circle cx="489" cy="115" r="6" fill="#D4AF37"/>
  <text x="611" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#FAF8F4">EN VIVO · ISO 400</text>

  <!-- Icono minimalista de cámara (izquierda, sin traslapar texto) -->
  <g transform="translate(96, 232) scale(0.76)">
    <rect x="0" y="18" width="166" height="120" rx="22" fill="#1A1917" stroke="#D4AF37" stroke-width="2.5"/>
    <path d="M52 18 L66 0 H100 L114 18" fill="#22201C" stroke="#D4AF37" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="83" cy="78" r="34" fill="#121212" stroke="url(#cam-gold-grad)" stroke-width="3"/>
    <circle cx="83" cy="78" r="18" fill="none" stroke="#FAF8F4" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="136" cy="44" r="6" fill="#D4AF37"/>
  </g>

  <!-- Tarjeta Polaroid decorativa (derecha, sin traslapar texto) -->
  <g transform="translate(952, 206) rotate(5) scale(0.76)">
    <rect x="0" y="0" width="215" height="270" rx="8" fill="#FAF8F4" fill-opacity="0.96"/>
    <rect x="14" y="14" width="187" height="198" rx="3" fill="url(#cam-polaroid-photo)"/>
    <circle cx="108" cy="108" r="34" fill="none" stroke="#FAF8F4" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="108" cy="108" r="14" fill="#D4AF37" fill-opacity="0.85"/>
    <text x="107" y="246" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="18" fill="#2B2720">35mm · Recuerdo</text>
  </g>

  <!-- Textos principales -->
  <text x="600" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3.5" fill="#D4AF37">CÁMARA DESECHABLE EN VIVO · ETERNO PASE</text>
  <text x="600" y="308" text-anchor="middle" font-family="Georgia, serif" font-size="88" font-weight="700" fill="#FAF8F4">Álbum Eterno</text>
  <line x1="450" y1="348" x2="750" y2="348" stroke="#D4AF37" stroke-opacity="0.55" stroke-width="2"/>
  <text x="600" y="402" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#A8A296">Captura el momento en Polaroid y guárdalo para siempre</text>

  <!-- Botón visual CTA -->
  <rect x="430" y="466" width="340" height="58" rx="29" fill="url(#cam-gold-grad)"/>
  <text x="600" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#121212">Abrir Cámara en Vivo</text>
</svg>
